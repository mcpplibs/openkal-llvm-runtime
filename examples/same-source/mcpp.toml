[package]
name    = "openkal-same-source"
version = "0.1.0"

# ⚠️ NO `[build] target`, AND THAT IS THE POINT OF THE DIRECTORY.
#
# The same `src/main.cpp` is built two ways from here:
#
#     mcpp run                              — this machine, over openkal-linux
#     mcpp run --target riscv64-none-elf    — riscv64, over OpenSBI, no OS
#
# and both print the same four lines. Pinning a target here would make the
# second command the only one, and then the directory would be an example of
# bare metal rather than a demonstration that the source does not know.

# No sysroot: there is no system to take headers or libraries from. The runner
# is the emulator with firmware, because `-bios default` is what supplies the
# SBI this program's openkal implementation calls.
#
# ⚠️ THE EMULATOR IS NAMED WITHOUT A PATH AND MUST STAY THAT WAY.
#
# Running this locally means pointing the name at an installed emulator, and the
# obvious way to do that is to edit this line. Doing so and committing puts one
# machine's absolute path into a file every other machine reads — measured
# twice in this ecosystem now, the first time in `conformance/mcpp.toml`, and
# both times the way it showed was every other repository's CI failing on a path
# that exists on exactly one laptop.
#
# The CI step that runs this rewrites the name in its own checkout and does not
# commit; do the same locally, or put the emulator on PATH.
[target.riscv64-none-elf]
sysroot = ""
runner  = ["qemu-system-riscv64", "-machine", "virt", "-nographic",
           "-no-reboot", "-bios", "default", "-kernel"]

[dependencies]
openkal-llvm-runtime = { path = "../.." }

# ⭐⭐ THE ONE LINE THAT MAKES EVERY TARGET REACHABLE, AND IT IS THE FAMILY NAME
# THAT DOES IT RATHER THAN THE VERSION.
#
# `openkal-llvm` downloads nothing `llvm` does not — it is the same payload, the
# same clang, the same version. What differs is what mcpp then believes about
# where the target side comes from: under `llvm`, from the payload built for
# THIS machine; under `openkal-llvm`, from the graph.
#
# ⚠️ Measured 2026-08-23 with `default = "llvm@22.1.8"` here, which is what this
# file said until now, and which built two of the four targets:
#
#     --target x86_64-windows-gnu  → x86_64-w64-mingw32-g++ … __config: No such file
#     --target aarch64-macos       → "no toolchain payload exists that runs here"
#
# Neither message mentions a toolchain family, and both are true of `llvm`: the
# payload really does have no macOS cross driver, and mingw really is the only
# thing here that emits PE. ⇒ The build did not fail to find the openkal path,
# it was never asked for it. One word, and the same source reaches all four.
[toolchain]
default = "openkal-llvm@22.1.8"
