# The C++ runtime inside an ok image (target `<arch>-openkal', openkal SPEC
# clause 12): one image per architecture, run through okrun on Linux, macOS and
# Windows. `import std', an exception, a thread, thread-local variables (one
# with a destructor) and the containers, above openkal-musl's image form.
[package]
name    = "image-cxx"
version = "0.1.0"

[dependencies]
openkal-llvm-runtime = { path = "../.." }

[targets.image-cxx]
kind = "bin"
main = "src/main.cpp"

# The platform (openkal-platform, mcpp 2026.10.27.1+) states the link, the
# seal and the tools; the three layers are this package and the C library
# beneath it, here by path.
